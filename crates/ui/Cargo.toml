[package]
name = "tutorialz-ui"
version = "0.1.0"
edition = "2021"
[features]
web = ["dioxus/web"]
mobile = ["dioxus/mobile", "dep:jni", "dep:ndk-context"]
[dependencies]
dioxus.workspace = true
serde.workspace = true
serde_json.workspace = true
tutorialz-core.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }
ndk-context = { version = "0.1", optional = true }
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Dioxus 0.7.10 history uses Location without enabling its web-sys feature.
web-sys = { version = "0.3", features = ["Location"] }

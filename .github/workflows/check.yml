name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: python3 -m unittest discover -s tests -p '*_test.py'
      - run: cargo test -p tutorialz-core --locked
      - run: cargo run -p tutorialz-core --locked -- content/catalog.json
      - run: cargo run -p tutorialz-core --locked -- content/enterprise/catalog.json
      - run: cargo check --workspace --target wasm32-unknown-unknown --locked
      - run: npm ci && npm test
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - run: node scripts/download-java-pack.mjs
      - run: python3 scripts/build-web.py
        env:
          SITE_BASE_PATH: tutorialz
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        shell: bash
        run: |
          python3 -m http.server 8765 > /tmp/runtime-server.log 2>&1 &
          mkdir -p /tmp/tutorialz-site/tutorialz
          cp -a dist/. /tmp/tutorialz-site/tutorialz/
          python3 -m http.server 8766 --directory /tmp/tutorialz-site > /tmp/app-server.log 2>&1 &
          export CHROME_BIN="$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          node scripts/browser-test.mjs
          APP_URL=http://127.0.0.1:8766/tutorialz/ node scripts/app-test.mjs
          APP_URL=http://127.0.0.1:8766/tutorialz/ node scripts/question-review-test.mjs
      # A debug harness tests the native reader without including it in dist/.
      - name: Mobile study reader checks
        shell: bash
        run: |
          dx build --web --package tutorialz-learner --features study-preview --base-path ''
          python3 -m http.server 8876 --directory target/dx/tutorialz-learner/debug/web/public > /tmp/study-server.log 2>&1 &
          export CHROME_BIN="$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          node scripts/study-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tutorialz-web
          path: dist
      - uses: actions/upload-pages-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - run: dx build --android --package tutorialz-learner --no-default-features --features mobile --target aarch64-linux-android --release
      - name: Apply native system-bar insets and rebuild APK
        run: |
          python3 scripts/patch-android-ui.py release
          cd target/dx/tutorialz-learner/release/android/app
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: tutorialz-android
          path: target/dx/**/*.apk
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

[package]
name = "tutorialz-learner"
version = "0.3.5"
edition = "2021"
[features]
default = ["web"]
web = ["dioxus/web", "tutorialz-ui/web"]
mobile = ["dioxus/mobile", "tutorialz-ui/mobile"]
# Explicit local browser harness for the Android study UI; never used by Pages.
study-preview = []
[dependencies]
dioxus.workspace = true
serde_json.workspace = true
tutorialz-core.workspace = true
tutorialz-ui.workspace = true
serde.workspace = true

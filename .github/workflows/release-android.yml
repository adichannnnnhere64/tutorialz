name: Release Android APK
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - run: cargo test -p tutorialz-core --locked
      - run: python3 scripts/android-release.py "$GITHUB_REF_NAME"
      - name: Build Android app
        run: dx build --android --package tutorialz-learner --no-default-features --features mobile --target aarch64-linux-android --release
      - name: Set upgrade version and rebuild APK
        run: |
          python3 scripts/android-release.py "$GITHUB_REF_NAME" --patch-gradle
          python3 scripts/patch-android-ui.py release
          cd target/dx/tutorialz-learner/release/android/app
          ./gradlew --no-daemon assembleRelease
      - name: Sign and verify APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tutorialz-release.jks"
          apk_dir=target/dx/tutorialz-learner/release/android/app/app/build/outputs/apk/release
          unsigned_apk=$(find "$apk_dir" -maxdepth 1 -name '*-unsigned.apk' -print -quit)
          test -n "$unsigned_apk"
          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/zipalign" -f 4 "$unsigned_apk" "$RUNNER_TEMP/tutorialz-aligned.apk"
          output="$GITHUB_WORKSPACE/tutorialz-${GITHUB_REF_NAME}-arm64.apk"
          "$build_tools/apksigner" sign --ks "$RUNNER_TEMP/tutorialz-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD --out "$output" "$RUNNER_TEMP/tutorialz-aligned.apk"
          "$build_tools/apksigner" verify --verbose "$output"
          "$build_tools/aapt" dump badging "$output" | head -1
          expected_code=$(python3 scripts/android-release.py "$GITHUB_REF_NAME" | sed -E 's/.*versionCode ([0-9]+)/\1/')
          "$build_tools/aapt" dump badging "$output" | head -1 | grep -F "name='dev.tutorialz.learner' versionCode='$expected_code' versionName='${GITHUB_REF_NAME#v}'"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if test -f "$notes"; then
            gh release create "$GITHUB_REF_NAME" "tutorialz-${GITHUB_REF_NAME}-arm64.apk" --verify-tag --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" "tutorialz-${GITHUB_REF_NAME}-arm64.apk" --verify-tag --generate-notes
          fi

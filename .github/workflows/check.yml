name: Check and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: cargo test -p tutorialz-core --locked
      - run: cargo run -p tutorialz-core --locked -- content/catalog.json
      - run: cargo check --workspace --target wasm32-unknown-unknown --locked
      - run: npm ci && npm test
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - run: node scripts/download-java-pack.mjs
      - run: python3 scripts/build-web.py
      - run: npx playwright install --with-deps chromium
      - name: Browser checks
        shell: bash
        run: |
          python3 -m http.server 8765 > /tmp/runtime-server.log 2>&1 &
          python3 -m http.server 8766 --directory dist > /tmp/app-server.log 2>&1 &
          export CHROME_BIN="$(node --input-type=module -e 'import {chromium} from "playwright"; console.log(chromium.executablePath())')"
          node scripts/browser-test.mjs
          node scripts/app-test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tutorialz-web
          path: dist
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'ndk;28.2.13676358' 'platforms;android-35' 'build-tools;35.0.0'
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - run: dx build --android --package tutorialz-learner --no-default-features --features mobile --target aarch64-linux-android --release
      - uses: actions/upload-artifact@v4
        with:
          name: tutorialz-android
          path: target/dx/**/*.apk
